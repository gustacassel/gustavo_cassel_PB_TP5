apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # transforma o traceId de cada linha de log em link para o trace no Zipkin
      derivedFields:
        - name: traceId
          matcherRegex: 'traceId=(\w+)'
          url: "$${__value.raw}"
          datasourceUid: zipkin

  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
