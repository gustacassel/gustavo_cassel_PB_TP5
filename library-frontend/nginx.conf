server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
