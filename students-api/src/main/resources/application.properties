spring.application.name=students-api

# O microsservico roda em uma porta propria; a library-api continua na 8080
server.port=8081

# Datasource proprio - banco separado do librarydb (isolamento de dominio)
spring.datasource.url=jdbc:h2:mem:studentsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web do H2 (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ (docker-compose.yml na raiz)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:library}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:library}
