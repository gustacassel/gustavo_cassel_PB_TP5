spring.application.name=students-api

# O microsservico roda em uma porta propria; a library-api continua na 8080
server.port=8081

# Datasource proprio - banco separado do librarydb (isolamento de dominio)
# sem variaveis de ambiente usa H2 em memoria; no Docker/Kubernetes aponta para o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:studentsdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
# avisos do ddl-auto ao criar as tabelas ("constraint does not exist, skipping")
logging.level.org.hibernate.orm.jdbc.warn=ERROR

# Console web do H2 (http://localhost:8081/h2-console)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Actuator - health com liveness/readiness para o Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# RabbitMQ (docker-compose.yml na raiz)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:library}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:library}
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Tracing - o trace atravessa gateway, APIs e RabbitMQ; exporta para o Zipkin quando habilitado
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.enabled=${ZIPKIN_ENABLED:false}
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
