spring.application.name=libraryapi
server.port=8080

# Datasource - livros, emprestimos, auditoria e a copia local dos estudantes
# sem variaveis de ambiente usa H2 em memoria; no Docker/Kubernetes aponta para o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:librarydb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# Console web do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Actuator - health com liveness/readiness para o Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# RabbitMQ (docker-compose.yml na raiz)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:library}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:library}
