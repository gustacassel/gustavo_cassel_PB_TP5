spring.application.name=api-gateway
server.port=8000

# Rotas - o front-end e as APIs ficam atras do gateway; os enderecos vem do ambiente
spring.cloud.gateway.server.webflux.routes[0].id=library-api
spring.cloud.gateway.server.webflux.routes[0].uri=${LIBRARY_API_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/library-api/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=students-api
spring.cloud.gateway.server.webflux.routes[1].uri=${STUDENTS_API_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/students-api/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# qualquer outro caminho vai para o front-end (por ultimo)
spring.cloud.gateway.server.webflux.routes[2].id=frontend
spring.cloud.gateway.server.webflux.routes[2].uri=${FRONTEND_URL:http://localhost:5173}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[2].order=100

# Actuator - health para as probes e /actuator/gateway/routes para consultar as rotas
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
management.endpoint.health.probes.enabled=true
