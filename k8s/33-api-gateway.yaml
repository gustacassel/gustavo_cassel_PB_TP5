# unica entrada do sistema: NodePort 30080 (porta 8000 do host no kind)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # sem isso o Kubernetes injeta RABBITMQ_PORT=tcp://... e sobrescreve a porta da aplicacao
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: ghcr.io/gustacassel/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: LIBRARY_API_URL
              value: http://library-api:8080
            - name: STUDENTS_API_URL
              value: http://students-api:8081
            - name: FRONTEND_URL
              value: http://frontend:80
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: biblioteca
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
